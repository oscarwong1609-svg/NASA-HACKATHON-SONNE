apply plugin: 'application'

application {
    mainClass = 'com.missionlab.lwjgl3.Lwjgl3Launcher'
}

// The assets/ folder is bundled inside the packaged game.
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// ./gradlew lwjgl3:run
run {
    workingDir = rootProject.file('assets')
    ignoreExitValue = true
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += ['-XstartOnFirstThread']
    }
}

// ./gradlew lwjgl3:jar  ->  lwjgl3/build/libs/MissionLab.jar (a single file with everything)
jar {
    archiveFileName = 'MissionLab.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    manifest {
        attributes 'Main-Class': 'com.missionlab.lwjgl3.Lwjgl3Launcher',
                'Implementation-Title': 'Mission Lab',
                'Implementation-Version': project.version
    }
}
